services:
  deepgram-transcriber:
    build: .
    container_name: deepgram-transcriber
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - traefik-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3456/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transcribe.rule=Host(`transcribe.co-evolve.nl`)"
      - "traefik.http.routers.transcribe.entrypoints=websecure"
      - "traefik.http.routers.transcribe.tls.certresolver=cloudflare"
      - "traefik.http.services.transcribe.loadbalancer.server.port=3456"

networks:
  traefik-network:
    name: traefik-network
    external: true
