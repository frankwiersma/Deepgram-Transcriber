[build]
  command = "npm install"
  publish = "static"

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."transcribe"]
  # Increase timeout for longer audio files (max 26 seconds on paid plans)
  timeout = 26

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
